name: Python CI (tests, coverage)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.11, 3.12]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (pytest) and save junit
        continue-on-error: false
        run: |
          . .venv/bin/activate
          pip install pytest pytest-cov junit-xml
          pytest -q --maxfail=1 --junitxml=reports/junit-${{ matrix.python }}.xml --cov=app --cov-report=xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports-${{ matrix.python }}
          path: |
            reports/junit-${{ matrix.python }}.xml
            coverage.xml

      - name: Show summary
        if: always()
        run: |
          echo "Done. JUnit report: reports/junit-${{ matrix.python }}.xml"
